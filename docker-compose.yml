services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - PORT=80
      - NODE_ENV=${NODE_ENV:-${ENV:-production}}
      - ENV=${ENV:-${NODE_ENV:-production}}
      - CORS_ORIGIN=${CORS_ORIGIN:-${CORS_ALLOWED_ORIGINS:-*}}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-${CORS_ORIGIN:-*}}
      - JWT_SECRET=${JWT_SECRET:-${JWT:-alvaradasorte-secret-key-change-in-production}}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - LOTTERY_API_PROVIDER=${LOTTERY_API_PROVIDER:-loteriascaixa}
      - LOTTERY_DISABLE_PROXY=${LOTTERY_DISABLE_PROXY:-true}
      - CAIXA_PROXY=${CAIXA_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - alvaradasorte-network

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        - VITE_BASE_URL=${VITE_BASE_URL:-${VITE_API_URL:-https://api.alvaradasorte.odutra.com}}
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - alvaradasorte-network

networks:
  alvaradasorte-network:
    driver: bridge
